<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Activity">
<style>



:root{--paper:#f4f1ea;--ink:#1a1a1a;--muted:#6b7280;--grid:#d1d5db;}
@media (prefers-color-scheme: dark){:root{--paper:#0d1117;--ink:#e6edf3;--muted:#8b949e;--grid:#30363d;}}


@keyframes riseIn { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:translateY(0);} }
@keyframes growUp { from { transform:scaleY(0);} to { transform:scaleY(1);} }
@keyframes popIn { 0%{opacity:0;transform:scale(.6)} 70%{transform:scale(1.08)} 100%{opacity:1;transform:scale(1)} }
@keyframes pulse { 0%{r:4;opacity:.6} 100%{r:14;opacity:0} }
@keyframes shine { 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
@keyframes printRow { from{opacity:0} to{opacity:1} }

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
text{font-family:'Geist',system-ui,sans-serif;fill:var(--ink);}
.serif{font-family:'Instrument Serif',Georgia,serif;}
.muted{fill:var(--muted);}
rect.bg{fill:var(--paper);}
</style>
<rect class="bg" width="880" height="240" rx="12"/>

  <text x="40" y="40" class="serif" font-size="26">Contributions per month</text>
  <text x="40" y="68" font-size="12" class="muted">streak 0 days · 0 active days · busiest 0 on </text>
  <rect x="60" y="200" width="40" height="0" fill="var(--ink)" rx="4"/>
